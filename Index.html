<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineup Brasil - Histórico e Próximos Shows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>🎵 Lineup Brasil</h1>
            <p>O maior arquivo de shows internacionais e nacionais no país (2010 - Futuro)</p>
        </div>
    </header>

    <main>
        <section class="controls-section">
            <input type="text" id="search-input" placeholder="Busque por artista, cidade ou festival...">
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="historico">Histórico (2010 - 2025)</button>
                <button class="filter-btn" data-filter="atual">Este Ano (2026)</button>
                <button class="filter-btn" data-filter="futuro">Próximos Anos (2027+)</button>
            </div>
        </section>

        <section class="shows-section">
            <div id="shows-container" class="shows-grid">
                </div>
            <div id="no-results" class="hidden">Nenhum show encontrado para a sua busca.</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Lineup Brasil. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
